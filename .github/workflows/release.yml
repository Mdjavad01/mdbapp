name: Release (signed)

# Builds the artefacts the two stores want, signed with the real key:
#
#   • APK  → کافه‌بازار (Bazaar does not accept App Bundles)
#   • AAB  → Google Play (required for new apps; Play re-signs it with the
#            Play App Signing key, our key becomes the *upload* key)
#
# Nothing here runs on a normal push: it needs four repository secrets, and a
# build that cannot sign is a build that produces nothing. Trigger it by pushing
# a tag `app-v<version>` or by hand from the Actions tab.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     base64 of mdbapp-release.jks   (base64 -w0 < file)
#   ANDROID_KEYSTORE_PASSWORD   storePassword from keystore.properties
#   ANDROID_KEY_ALIAS           mdbapp
#   ANDROID_KEY_PASSWORD        keyPassword from keystore.properties

on:
  push:
    tags: [ 'app-v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  signed:
    name: prod release · APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      # Fail early and loudly: a release build without the key produces an
      # *unsigned* APK (the Gradle config deliberately refuses to fall back to
      # the debug key), which is exactly the artefact Play and Bazaar reject
      # after the upload, not before it.
      - name: Check the signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=0
          for name in KEYSTORE_B64 STORE_PASS KEY_PASS ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is empty — see the header of .github/workflows/release.yml"
              missing=1
            fi
          done
          exit $missing

      - name: Write the keystore and keystore.properties
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > mdbapp-release.jks
          # printf, not a heredoc: a heredoc inside an indented YAML block keeps
          # the indentation in the file, and a leading space in a .properties
          # line is a different key as far as a reader's eyes are concerned.
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "mdbapp-release.jks" "$STORE_PASS" "$ALIAS" "$KEY_PASS" > keystore.properties
          chmod 600 mdbapp-release.jks keystore.properties

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build signed APK and AAB
        run: ./gradlew assembleProdRelease bundleProdRelease --stacktrace

      # Verify, do not assume. A build signed with the wrong key looks identical
      # until a store rejects the upload, and Play rejects it permanently: the
      # first upload fixes the app's identity for good.
      - name: Verify the signature
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$SDK/build-tools/36.0.0/apksigner"
          APK=$(ls app/build/outputs/apk/prod/release/*.apk | head -1)
          echo "APK: $APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt

          EXPECTED="46ce5f935530088a109507f28f0bed44c571eadb072736efc939b5de77ba062a78"
          DIGEST=$(grep -i "SHA-256 digest" certs.txt | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$DIGEST" != "$EXPECTED" ]; then
            echo "::error::signed with the wrong key — got $DIGEST, expected $EXPECTED"
            exit 1
          fi
          echo "signed with the release key ✔"

          AAB=$(ls app/build/outputs/bundle/prodRelease/*.aab | head -1)
          unzip -l "$AAB" | grep -qE 'META-INF/[A-Z0-9]+\.(RSA|EC|DSA)' \
            || { echo "::error::the AAB is not signed"; exit 1; }
          echo "AAB: $AAB (signed)"

      - name: Collect artefacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/prod/release/*.apk out/
          cp app/build/outputs/bundle/prodRelease/*.aab out/
          ls -la out

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: mdbapp-prod-release
          path: out/*
          if-no-files-found: error
          retention-days: 90

      # A tag push also attaches the two files to a GitHub release, so the
      # owner has one place to download from later.
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
