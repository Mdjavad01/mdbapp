name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17 is required by AGP 8.x. The Gradle cache below is keyed on the
      # wrapper properties so a Gradle upgrade invalidates it correctly.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble dev debug
        run: ./gradlew assembleDevDebug --stacktrace

      # `lint` is configured with abortOnError = true, so a lint error fails CI.
      - name: Android Lint
        run: ./gradlew lintDevDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDevDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
